name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-contracts:
    name: Lint Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bradbury source is the Studio source with the Bradbury header
        run: python scripts/bradbury_source.py --check
      - run: genvm-lint check contracts/pay_clear.py
      - run: genvm-lint check contracts/pay_clear.bradbury.py

  test-direct:
    name: Direct Mode Tests (Studio runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/direct/ -v

  test-direct-bradbury:
    name: Direct Mode Tests (Bradbury runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct/bundles-v2
          key: genvm-manager-v0.6.0-rc10
      # genlayer-test 0.30 reads the Bradbury runner (py-genlayer:babwp…) from genvm-manager v0.6.0-rc10.
      - run: pip install "genlayer-test==0.30.0rc2"
      - run: python -m pytest tests/direct/ -v
        env:
          PAYCLEAR_NETWORK: bradbury

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_STUDIO_CONTRACT: "0x6dEc38B51C07120b910fe6b0a6c07b3Cf92A238D"
